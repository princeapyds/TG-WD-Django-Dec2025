{% extends 'myapp/base.html' %}
{% block content %}

<h2>Marks List</h2>

<a href="{% url 'add_marks' %}" class="btn btn-success mb-3">+ Add Marks</a>

<table class="table table-bordered table-striped">
    <tr>
        <th>Student</th>
        <th>Subject</th>
        <th>Marks</th>
        <th>Exam Type</th>
        <th>Date</th>
    </tr>

    {% for m in marks %}
    <tr>
        <td>{{ m.student.name }}</td>
        <td>{{ m.subject.subject_name }}</td>
        <td>{{ m.marks }}</td>
        <td>{{ m.exam_type }}</td>
        <td>{{ m.date }}</td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
