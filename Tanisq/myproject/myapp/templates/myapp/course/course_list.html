{% extends 'myapp/base.html' %}
{% block content %}

<h2>Course List</h2>

<a href="{% url 'add_course' %}" class="btn btn-success mb-3">+ Add Course</a>

<table class="table table-bordered table-striped">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Description</th>
        <th>Actions</th>
    </tr>

    {% for c in courses %}
    <tr>
        <td>{{ c.id }}</td>
        <td>{{ c.course_name }}</td>
        <td>{{ c.course_description }}</td>
        <td>
            <a href="{% url 'edit_course' c.id %}" class="btn btn-warning btn-sm">Edit</a>
            <a href="{% url 'delete_course' c.id %}" class="btn btn-danger btn-sm"
                onclick="return confirm('Delete course?')">Delete</a>
        </td>
    </tr>
    {% endfor %}

</table>

{% endblock %}
