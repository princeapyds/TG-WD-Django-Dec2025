{% extends 'myapp/base.html' %}
{% block content %}

<h2>Teacher List</h2>

<a href="{% url 'add_teacher' %}" class="btn btn-success mb-3">+ Add Teacher</a>

<table class="table table-bordered table-striped">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Qualification</th>
        <th>Actions</th>
    </tr>

    {% for t in teachers %}
    <tr>
        <td>{{ t.id }}</td>
        <td>{{ t.name }}</td>
        <td>{{ t.email }}</td>
        <td>{{ t.qualification }}</td>
        <td>
            <a href="{% url 'edit_teacher' t.id %}" class="btn btn-warning btn-sm">Edit</a>
            <a href="{% url 'delete_teacher' t.id %}" class="btn btn-danger btn-sm"
               onclick="return confirm('Delete teacher?')">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
